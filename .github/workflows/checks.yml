# Plain checks on every push and pull request. No secrets, no external services, safe for forks.
name: Checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish gate (spelling, shellcheck, markdown, links, size budget)
        run: |
          pip install codespell shellcheck-py
          npm install -g markdownlint-cli
          scripts/lint-repo.sh

      - name: Final check flags typos and leftovers on added lines only
        run: |
          d="$(mktemp -d)"; cd "$d"; git init -q .; git config user.email a@b; git config user.name a
          printf 'let a = 1\n' > a.txt; git add .; git commit -qm 1
          printf 'let a = 1\n// %s it\nNSLog("x")\n' "recie""ve" > a.txt
          if "$GITHUB_WORKSPACE/scripts/final-check.sh" --local; then echo "should have failed"; exit 1; fi
          printf 'let a = 1\n// receive it\n' > a.txt
          "$GITHUB_WORKSPACE/scripts/final-check.sh" --local

      - name: verify-spec refuses a spec without final check and independent verdict
        run: |
          d="$(mktemp -d)"; cp specs/template/*.md "$d"/; sed -i 's/^- \[ \]/- [x]/' "$d/verification.md"
          out="$(scripts/verify-spec.sh "$d" || true)"
          echo "$out" | grep -q "no 'final-check: clean'" && echo "$out" | grep -q "no independent-pass verdict"

      - name: Workflow files are valid
        run: |
          pip install actionlint-py
          actionlint -shellcheck= .github/workflows/*.yml adapters/github-actions/pr-review.yml

      - name: Shell scripts parse
        run: |
          for f in scripts/*.sh scripts/probes/*.sh; do
            bash -n "$f" || { echo "syntax error in $f"; exit 1; }
          done

      - name: Scripts keep their executable bit
        run: |
          bad="$(git ls-files -s 'scripts/*.sh' 'scripts/probes/*.sh' | awk '$1 != "100755" {print $4}')"
          if [ -n "$bad" ]; then echo "not executable in git:"; echo "$bad"; exit 1; fi

      - name: Core stays agent- and stack-neutral
        run: scripts/neutrality-check.sh

      - name: No long dashes in the repo
        run: |
          em="$(printf '\342\200\224')"; en="$(printf '\342\200\223')"
          if grep -rIn --exclude-dir=.git -e "$em" -e "$en" . ; then echo "replace long dashes with plain hyphens"; exit 1; fi

      - name: pr-threads reads threads from a fake Azure server
        run: |
          set -e
          t="$(mktemp -d)"; mkdir -p "$t/bin" "$t/r"; git -C "$t/r" init -q .
          git -C "$t/r" remote add origin "https://o@dev.azure.com/o/My%20Proj/_git/app"
          printf '#!/bin/sh\nurl=""; out=""; while [ $# -gt 0 ]; do case "$1" in -o) out="$2"; shift;; http*) url="$1";; esac; shift; done\ncat >/dev/null\ncase "$url" in *threads*) echo "{\\"value\\":[{\\"id\\":1,\\"comments\\":[{\\"author\\":{\\"displayName\\":\\"Al\\"},\\"content\\":\\"hello\\"}]}]}" > "$out";; *) echo "{\\"title\\":\\"T\\"}" > "$out";; esac\n' > "$t/bin/curl"; chmod +x "$t/bin/curl"
          out="$(cd "$t/r" && FORGE_AZURE_PAT=x PATH="$t/bin:$PATH" "$OLDPWD/scripts/pr-threads.sh" 5)"
          echo "$out" | grep -q 'TITLE: T'; echo "$out" | grep -q 'Al: hello'

      - name: pr-watch reports new and updated PRs and forgets finished ones
        run: |
          set -e
          t="$(mktemp -d)"; git init -q --bare "$t/o.git"; git init -q -b main "$t/w"; cd "$t/w"
          git config user.email a@b; git config user.name n; git remote add origin "$t/o.git"
          echo a > f; git add .; git commit -qm one; git push -q origin main
          c1="$(git rev-parse HEAD)"; git push -q origin "$c1:refs/pull/1/merge" "$c1:refs/pull/2/merge"
          cd "$OLDPWD"; export FORGE_STATE_HOME="$t/s"; mkdir -p "$FORGE_STATE_HOME"; printf 'w %s\n' "$t/w" > "$FORGE_STATE_HOME/watch-repos.txt"
          scripts/pr-watch.sh; grep -q 'watching 2' "$FORGE_STATE_HOME/watch.log"
          cd "$t/w"; echo b >> f; git commit -qam two; c2="$(git rev-parse HEAD)"
          git push -q origin "$c2:refs/pull/3/merge"; git push -qf origin "$c2:refs/pull/1/merge"; git push -q origin :refs/pull/2/merge; cd "$OLDPWD"
          scripts/pr-watch.sh
          grep -q 'PR 3 is new' "$FORGE_STATE_HOME/watch.log"; grep -q 'PR 1 has new commits' "$FORGE_STATE_HOME/watch.log"; grep -q 'PR 2 no longer active' "$FORGE_STATE_HOME/watch.log"

      - name: pr-watch ignores a moved target branch and forgets an emptied list
        run: |
          set -e
          W="$GITHUB_WORKSPACE"
          t="$(mktemp -d)"; git init -q --bare "$t/o.git"; git init -q -b main "$t/w"; cd "$t/w"
          git config user.email a@b; git config user.name n; git remote add origin "$t/o.git"
          echo a > f; git add .; git commit -qm one; git push -q origin main; T1="$(git rev-parse HEAD)"
          git checkout -q -b feat; echo p > p; git add .; git commit -qm pr; P="$(git rev-parse HEAD)"; git checkout -q main
          tree="$(git rev-parse "$T1^{tree}")"
          M1="$(git commit-tree "$tree" -p "$T1" -p "$P" -m merge1)"
          git push -q origin "$M1:refs/pull/7/merge" "$P:refs/forge-src/7"
          export FORGE_STATE_HOME="$t/s"; mkdir -p "$FORGE_STATE_HOME"; printf 'w %s\n' "$t/w" > "$FORGE_STATE_HOME/watch-repos.txt"
          cd "$OLDPWD"; "$W/scripts/pr-watch.sh"; grep -q 'watching 1' "$FORGE_STATE_HOME/watch.log"
          # target branch moves: the merge commit changes, the PR's own head does not
          cd "$t/w"; echo b >> f; git commit -qam two; T2="$(git rev-parse HEAD)"; git push -q origin main
          M2="$(git commit-tree "$(git rev-parse "$T2^{tree}")" -p "$T2" -p "$P" -m merge2)"
          git push -qf origin "$M2:refs/pull/7/merge"; cd "$OLDPWD"
          "$W/scripts/pr-watch.sh"
          grep -q 'PR 7: target branch moved' "$FORGE_STATE_HOME/watch.log"
          if grep -q 'PR 7 has new commits' "$FORGE_STATE_HOME/watch.log"; then echo "FAIL: reported an update"; exit 1; fi
          # the PR gets a new commit: reported
          cd "$t/w"; git checkout -q feat; echo q > q; git add .; git commit -qm more; P2="$(git rev-parse HEAD)"; git checkout -q main
          M3="$(git commit-tree "$(git rev-parse "$T2^{tree}")" -p "$T2" -p "$P2" -m merge3)"
          git push -qf origin "$M3:refs/pull/7/merge"; cd "$OLDPWD"
          "$W/scripts/pr-watch.sh"; grep -q 'PR 7 has new commits' "$FORGE_STATE_HOME/watch.log"
          # every PR completed: an empty but successful listing forgets them
          cd "$t/w"; git push -q origin :refs/pull/7/merge; cd "$OLDPWD"
          "$W/scripts/pr-watch.sh"; grep -q 'PR 7 no longer active' "$FORGE_STATE_HOME/watch.log"
          test ! -e "$FORGE_STATE_HOME/watch/w/7"
          # a failed listing keeps state
          cd "$t/w"; git remote set-url origin "$t/missing.git"; cd "$OLDPWD"
          "$W/scripts/pr-watch.sh"; grep -q 'ls-remote failed' "$FORGE_STATE_HOME/watch.log"
          echo PRWATCH-OK

      - name: pr-threads reads the common Azure remote URL forms
        run: |
          chk() { git remote remove origin 2>/dev/null || true; git remote add origin "$1"; got="$(FORGE_THREADS_PARSE_ONLY=1 "$GITHUB_WORKSPACE/scripts/pr-threads.sh" 5 2>&1)"; [ "$got" = "$2" ] || { echo "$1 -> $got (want $2)"; exit 1; }; }
          set -e; d="$(mktemp -d)"; cd "$d"; git init -q .
          chk 'https://acme@dev.azure.com/acme/My%20Proj/_git/App' 'acme/My%20Proj/App'
          chk 'git@ssh.dev.azure.com:v3/acme/Proj/App' 'acme/Proj/App'
          chk 'https://acme.visualstudio.com/Proj/_git/App' 'acme/Proj/App'
          chk 'https://acme.visualstudio.com/DefaultCollection/Proj/_git/App' 'acme/Proj/App'
          chk 'acme@vs-ssh.visualstudio.com:v3/acme/Proj/App' 'acme/Proj/App'
          chk 'https://acme.visualstudio.com/_git/App' 'acme/App/App'

      - name: review-post anchors findings on changed lines
        run: |
          set -e
          t="$(mktemp -d)"; mkdir -p "$t/bin"
          printf '#!/bin/sh\nif [ "$1 $2" = "api repos/me/p/pulls/1/files" ]; then printf "@@FILE src/a.txt\\n@@ -1,2 +1,3 @@\\n+x\\n y\\n z\\n"; fi\n' > "$t/bin/gh"; chmod +x "$t/bin/gh"
          printf 'Reviewed: a..b | Pass: independent | Mode: standard | Coverage: full\n\n## Findings\n\n### [MEDIUM] Correctness - a.txt:2\n**Issue:** on a changed line\n\n### [LOW] Style - a.txt:99\n**Issue:** not on a changed line\n\n## Summary\nVerdict: Request changes\n' > "$t/r.md"
          out="$(PATH="$t/bin:$PATH" scripts/review-post.sh "$t/r.md" me/p 1 abc --dry-run)"
          echo "$out" | grep -q 'would comment on src/a.txt:2 \[MEDIUM\]'
          echo "$out" | grep -q 'not on a changed line (kept in summary): 1'

      - name: review-poll dedupes and respects the limit
        run: |
          set -e
          t="$(mktemp -d)"; mkdir -p "$t/bin" "$t/clone/.git" "$t/state"
          printf '#!/bin/sh\nprintf "7 aaaaaaa1111\\n8 bbbbbbb2222\\n"\n' > "$t/bin/gh"; chmod +x "$t/bin/gh"
          printf 'me/proj %s\n' "$t/clone" > "$t/state/repos.txt"
          export FORGE_STATE_HOME="$t/state" PATH="$t/bin:$PATH"
          export FORGE_AGENT_CMD='printf "Reviewed: a..b | Pass: independent | Mode: standard | Coverage: full\n\nVerdict: Approve\n"'
          scripts/review-poll.sh --max 1
          [ "$(ls "$t/state/reviews" | wc -l)" -eq 1 ]
          scripts/review-poll.sh --max 5
          [ "$(ls "$t/state/reviews" | wc -l)" -eq 2 ]
          scripts/review-poll.sh
          [ "$(ls "$t/state/reviews" | wc -l)" -eq 2 ]

      - name: Plugin copy matches the sources
        run: adapters/claude-code/sync-plugin.sh --check

      - name: install.sh runs without changing anything
        run: |
          HOME="$(mktemp -d)" ./install.sh | grep -q 'scripts run'

      - name: Playbook index works
        run: scripts/playbook.sh stacks

      - name: Verdict check catches a softened verdict
        run: |
          set -e
          t="$(mktemp -d)"
          printf 'Reviewed: a..b | Pass: independent | Mode: strict | Coverage: all\n\n### [HIGH] Correctness - a:1\nx\n\nVerdict: Approve with comments\n' > "$t/soft.md"
          printf 'Reviewed: a..b | Pass: independent | Mode: strict | Coverage: all\n\n### [HIGH] Correctness - a:1\nx\n\nVerdict: Request changes\n' > "$t/ok.md"
          if scripts/verdict-check.sh "$t/soft.md"; then echo "softened verdict not caught"; exit 1; fi
          scripts/verdict-check.sh "$t/ok.md"

      - name: review-prep runs all scans in one command
        run: |
          set -e
          R="$PWD"; t="$(mktemp -d)"; cd "$t"
          git init -q -b main .; git config user.email a@b; git config user.name n
          mkdir src; printf 'let a = 1\n' > src/a.txt; git add .; git commit -qm base
          git checkout -q -b feat; printf 'let a = 2\n' > src/a.txt; git commit -qam change
          out="$("$R/scripts/review-prep.sh" main..feat)"
          for h in "-- TRIAGE" "-- IMPACT" "-- REUSE" "-- PLAYBOOK" "-- TIMINGS"; do echo "$out" | grep -q -e "$h" || { echo "missing $h"; exit 1; }; done
          echo x >> src/a.txt; "$R/scripts/review-prep.sh" --local | grep -q "uncommitted"

  macos:
    # The scripts must work with the BSD tools that ship on macOS (sed, awk), not only GNU ones.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Impact scan prints its area summary
        run: |
          set -e
          tk="$PWD"
          cd "$(mktemp -d)"
          git init -q .
          git config user.email ci@example.com && git config user.name ci
          mkdir -p Core/A Core/B
          printf 'func fooHelper() {}\n' > Core/A/x.swift  # forge-allow: impact.sh scans Swift files
          printf 'func bar() { fooHelper() }\n' > Core/B/y.swift  # forge-allow
          git add . && git commit -qm init
          out="$("$tk/scripts/impact.sh" --symbols fooHelper)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'area Core/B: 1 files'

      - name: Review runner refuses output without the header
        run: |
          set -e
          tk="$PWD"
          cd "$(mktemp -d)"
          git init -q .
          git config user.email ci@example.com && git config user.name ci
          echo a > f && git add . && git commit -qm 1 && echo b >> f && git commit -qam 2
          FORGE_AGENT_CMD='printf "Reviewed: ok\n"' "$tk/scripts/ci-review.sh" --base HEAD~1 --head HEAD --pr 1 --host none
          if FORGE_AGENT_CMD='printf "no header\n"' "$tk/scripts/ci-review.sh" --base HEAD~1 --head HEAD --pr 1 --host none; then
            echo "runner posted output that had no header"; exit 1
          fi

      - name: Diff scope separates tests and suggests a mode
        run: |
          set -e
          tk="$PWD"
          cd "$(mktemp -d)"
          git init -q .
          git config user.email ci@example.com && git config user.name ci
          mkdir -p src/latest Tests
          echo a > src/latest/A.txt && echo a > Tests/ATests.txt && echo a > src/contest.txt
          git add . && git commit -qm base
          printf 'b\n' >> src/latest/A.txt && printf 'b\n' >> Tests/ATests.txt && printf 'b\n' >> src/contest.txt
          git commit -qam head
          out="$("$tk/scripts/diff-scope.sh" HEAD~1 HEAD)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'SKIM'
          printf '%s\n' "$out" | grep -q 'suggested mode: fast'
          printf '%s\n' "$out" | sed -n '/-- READ/,/-- SKIM/p' | grep -q 'src/latest/A.txt'

      - name: Reuse scan matches whole camelCase words only
        run: |
          set -e
          tk="$PWD"
          cd "$(mktemp -d)"
          git init -q .
          git config user.email ci@example.com && git config user.name ci
          mkdir S
          printf 'extension String {\n    func formatDate() -> String { return self }\n}\n' > S/H.swift   # forge-allow: reuse-scan.sh indexes Swift
          git add . && git commit -qm base
          printf 'func run() {\n    let message = "y"\n    func formatDateLong() {}\n}\n' > S/N.swift   # forge-allow
          git add . && git commit -qm head
          out="$(REUSE_DEBUG=1 "$tk/scripts/reuse-scan.sh" HEAD~1 HEAD)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q "declares 'formatDateLong'"
          if printf '%s\n' "$out" | grep -q "declares 'message'"; then echo "local name flagged"; exit 1; fi
